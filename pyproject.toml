[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dog-crash-sim"
version = "0.2.0"
description = "Rear-seat car crash simulator for testing dog harnesses with a scalable musculoskeletal MuJoCo dog"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3", "numpy>=1.24", "pyyaml>=6", "matplotlib>=3.7", "pillow>=9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dog-crash-sim = "dog_crash_sim.cli:main"

[tool.setuptools.packages.find]
include = ["dog_crash_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
